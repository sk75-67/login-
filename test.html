<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Study Zone - Timed Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .test-container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 80%;
      max-width: 600px;
      text-align: center;
    }
    h1 { margin-bottom: 20px; color: #333; }
    .options label {
      display: block;
      background: #f7f7f7;
      padding: 10px;
      border-radius: 8px;
      margin: 8px 0;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    .options label:hover { background: #2065ce; color: #fff; }
    .correct { border: 2px solid green; }
    .wrong { border: 2px solid red; }
    .result { font-size: 1.2rem; margin-top: 20px; font-weight: bold; }
    .timer { font-size: 1.1rem; color: #e74c3c; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>Study Zone - Test</h1>
    <div id="timer" class="timer"></div>
    <div id="quiz"></div>
    <div id="result" class="result"></div>
  </div>

  <script>
    const questions = [
      {q: "दो त्रिभुज समान (Congruent) कब कहलाते हैं?", options: ["जब उनके क्षेत्रफल समान हों","जब उनके कोण समान हों","जब उनके आकार और आकार दोनों समान हों","जब उनकी परिमाप समान हो"], answer: "जब उनके आकार और आकार दोनों समान हों"},
      {q: "SSS नियम किसके लिए प्रयोग होता है?", options: ["समान त्रिभुज","सर्वांगसम त्रिभुज","समानांतर चतुर्भुज","वृत्त"], answer: "सर्वांगसम त्रिभुज"},
      {q: "SAS नियम में क्या शर्त होती है?", options: ["दो भुजाएँ और उनके बीच का कोण समान होना चाहिए","केवल कोण समान होना चाहिए","केवल भुजाएँ समान होनी चाहिए","क्षेत्रफल समान होना चाहिए"], answer: "दो भुजाएँ और उनके बीच का कोण समान होना चाहिए"}
    ];

    let current = 0;
    let score = 0;
    let timeLeft = 10;
    let timerId;

    function showQuestion(index) {
      clearInterval(timerId);
      timeLeft = 10;
      startTimer();

      let q = questions[index];
      let quizDiv = document.getElementById("quiz");
      quizDiv.innerHTML = `
        <p><b>Q${index+1}: ${q.q}</b></p>
        <div class="options">
          ${q.options.map(opt => `<label><input type="radio" name="option" value="${opt}"> ${opt}</label>`).join("")}
        </div>
      `;

      // Add click event for instant highlight
      document.querySelectorAll('.options input').forEach(input => {
        input.addEventListener('change', () => {
          let labels = document.querySelectorAll('.options label');
          labels.forEach(label => label.classList.remove('correct','wrong'));
          labels.forEach(label => {
            let val = label.querySelector('input').value;
            if(val === q.answer){
              label.classList.add('correct');
            }
            if(label.querySelector('input').checked && val !== q.answer){
              label.classList.add('wrong');
            }
          });
          if(input.value === q.answer){ score++; }
          setTimeout(() => nextQuestion(), 1500);
        });
      });
    }

    function startTimer() {
      document.getElementById("timer").innerText = "⏳ Time Left: " + timeLeft + "s";
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = "⏳ Time Left: " + timeLeft + "s";
        if(timeLeft <= 0) {
          clearInterval(timerId);
          nextQuestion();
        }
      }, 1000);
    }

    function nextQuestion(){
      current++;
      if(current < questions.length) {
        showQuestion(current);
      } else {
        document.getElementById("quiz").innerHTML = "";
        document.getElementById("timer").innerHTML = "";
        document.getElementById("result").innerText = "✅ आपका Score: " + score + "/" + questions.length;
      }
    }

    showQuestion(current);
  </script>
</body>
</html>
