<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Zone - Timed Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .test-container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 80%;
      max-width: 600px;
      text-align: center;
    }
    h1 { margin-bottom: 20px; color: #333; }
    .options label {
      display: block;
      background: #f7f7f7;
      padding: 10px;
      border-radius: 8px;
      margin: 8px 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .options label:hover { background: #2065ce; color: #fff; }
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #2065ce;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover { background: #164a9c; }
    .result { font-size: 1.2rem; margin-top: 20px; font-weight: bold; }
    .timer { font-size: 1.1rem; color: #e74c3c; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>Study Zone - Test</h1>
    <div id="timer" class="timer"></div>
    <div id="quiz"></div>
    <div id="result" class="result"></div>
  </div>

  <script>
    const questions = [
      {q: "HTML का full form क्या है?", options: ["Hyper Text Markup Language","High Tech Machine Language","Hyperlinks and Text Management Language"], answer: "Hyper Text Markup Language"},
      {q: "CSS का use किसलिए होता है?", options: ["Web page structure","Web page styling","Database management"], answer: "Web page styling"},
      {q: "JavaScript किसके लिए use होता है?", options: ["Styling","Interactivity","Server hosting"], answer: "Interactivity"}
    ];

    let current = 0;
    let score = 0;
    let timeLeft = 10; // ⏱ हर question के लिए 10 सेकंड
    let timerId;

    function showQuestion(index) {
      clearInterval(timerId);
      timeLeft = 10;
      startTimer();

      let q = questions[index];
      let quizDiv = document.getElementById("quiz");
      quizDiv.innerHTML = `
        <p><b>Q${index+1}: ${q.q}</b></p>
        <div class="options">
          ${q.options.map(opt => `<label><input type="radio" name="option" value="${opt}"> ${opt}</label>`).join("")}
        </div>
        <button onclick="submitAnswer()" class="btn">Submit</button>
      `;
    }

    function startTimer() {
      document.getElementById("timer").innerText = "⏳ Time Left: " + timeLeft + "s";
      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").innerText = "⏳ Time Left: " + timeLeft + "s";
        if(timeLeft <= 0) {
          clearInterval(timerId);
          submitAnswer(); // ⏱ Auto submit when time ends
        }
      }, 1000);
    }

    function submitAnswer() {
      clearInterval(timerId);
      let selected = document.querySelector('input[name="option"]:checked');
      if(selected && selected.value === questions[current].answer) {
        score++;
      }
      current++;
      if(current < questions.length) {
        showQuestion(current);
      } else {
        document.getElementById("quiz").innerHTML = "";
        document.getElementById("timer").innerHTML = "";
        document.getElementById("result").innerText = "✅ आपका Score: " + score + "/" + questions.length;
      }
    }

    // Start quiz
    showQuestion(current);
  </script>
</body>
</html>
