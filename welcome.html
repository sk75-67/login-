<!DOCTYPE html>
<html>
<head>
  <title>Welcome - Study Zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="welcome-container">
    <!-- ✅ id="welcomeMsg" जोड़ा -->
    <h1 id="welcomeMsg">Welcome to Study Zone</h1>
    <div class="sections">
      <div class="section" onclick="goTo('profile.html')">👤 Profile</div>
      <div class="section" onclick="goTo('chat.html')">💬 Chat</div>
      <div class="section" onclick="goTo('notes.html')">📘 Notes</div>
      <div class="section" onclick="goTo('test.html')">📝 Test</div>
    </div>
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </div>

  <script>
    function goTo(page) {
      window.location.href = page;
    }

    // ✅ Username fetch from localStorage
    let user = localStorage.getItem("loggedName");
    if(user) {
      document.getElementById("welcomeMsg").innerText = "Welcome, " + user + "!";
    }

    function logout() {
      localStorage.removeItem("loggedName");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
