<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
   body {
       font-family: 'Segoe UI', Arial, sans-serif;
       background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
       display: flex;
       justify-content: center;
       align-items: center;
       height: 100vh;
       margin: 0;
     }
     .login-box {
       background: #fff;
       padding: 40px;
       border-radius: 12px;
       box-shadow: 0 8px 20px rgba(0,0,0,0.2);
       width: 100%;
       max-width: 400px;
       animation: fadeIn 1s ease-in-out;
     }
     .login-box h2 {
       text-align: center;
       margin-bottom: 20px;
       font-size: 2rem;
       color: #333;
     }
     label {
       font-weight: bold;
       display: block;
       margin-top: 10px;
       text-align: left;
     }
     input {
       width: 100%;
       padding: 10px;
       margin: 8px 0;
       border-radius: 8px;
       border: 1px solid #ccc;
       font-size: 1rem;
       transition: border 0.3s ease;
     }
     input:focus {
       border: 1px solid #2065ce;
       outline: none;
     }
     input[type="submit"] {
       background: #2065ce;
       color: #fff;
       border: none;
       cursor: pointer;
       font-size: 1rem;
       font-weight: bold;
       transition: background 0.3s ease;
     }
     input[type="submit"]:hover {
       background: #164a9c;
     }
     .error {
       color: #e74c3c;
       font-size: 14px;
       margin-top: 10px;
       text-align: center;
     }
     @keyframes fadeIn {
       from {opacity: 0; transform: translateY(20px);}
       to {opacity: 1; transform: translateY(0);}
     }
  </style>
</head>
<body>

<div class="login-box">
   <!-- ✅ Logo added -->
  <img src="studyzone-logo.png" alt="Study Zone Logo" style="width:300px; display:block; margin:0 auto 20px;">
  <h2><span class="key-symbol">🔑</span>Login</h2>
  <!-- ✅ form tag सही किया -->
  <form onsubmit="return redirectToWelcome()">
     <label><b>Name:</b></label>
    <input type="text" id="name" placeholder="Enter Your Name">

    <label><b>User ID:</b></label>
    <input type="text" id="userid" oninput="clearError(this)" placeholder="Enter User ID">

    <label><b>Password:</b></label>
    <input type="password" id="password" oninput="clearError(this)" placeholder="Enter Password">

    <input type="submit" value="Login">

    <div id="errorMsg" class="error"></div>
  </form>
</div>

<script>
 function redirectToWelcome() {
  let nameInput = document.getElementById("name");
  let userInput = document.getElementById("userid");
  let passInput = document.getElementById("password");
  let errorMsg = document.getElementById("errorMsg");

  let name = nameInput.value;
  let user = userInput.value;
  let pass = passInput.value;

  let users = [
    {id: "Aayush", pass: "12345"},
    {id: "Bambam", pass: "12345"},
    {id: "Pritam", pass: "12345"},
    {id: "Shubham", pass: "7575"}
  ];

  // Reset styles
  userInput.classList.remove("input-error");
  passInput.classList.remove("input-error");
  errorMsg.innerHTML = "";

  // Blank check
  if (name.trim() === "" || user.trim() === "" || pass.trim() === "") {
    errorMsg.innerHTML = "❌ Name, User ID aur Password blank nahi hone chahiye!";
    return false;
  }

  let foundUser = users.find(u => u.id === user);

  if (!foundUser) {
    errorMsg.innerHTML = "❌ User ID galat hai!";
    userInput.classList.add("input-error");
    return false;
  } else if (foundUser.pass !== pass) {
    errorMsg.innerHTML = "❌ Password galat hai!";
    passInput.classList.add("input-error");
    return false;
  } else {
    // ✅ Save Name in localStorage
    localStorage.setItem("loggedName", name);
    window.location.href = "welcome.html";
    return false;
  }
}

</script>

</body>
</html>
