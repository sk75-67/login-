<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      width: 100%;   
      max-width: 400px;               /* Box ki width */
      margin: 100px auto;            /* Center me lane ke liye */
      padding: 20px;                 /* Andar space */
      background-color: #f0f0f0;     /* Light red background */
      border: 2px solid rgb(20, 20, 20);         /* Red border frame */
      border-radius: 8px;           /* Corner curve */
      box-shadow: 0 0 10px rgba(196, 187, 187, 0.3); /* Thoda shadow */
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    .error {
      color: rgb(241, 3, 3);
      font-size: 16px;
      margin-top: 10px;
    }
    .input-error {
      border: 2px solid rgb(241, 7, 7);
      background-color: #ffe5e5;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    input[type="submit"] {
      background-color: rgb(20, 79, 206);
      color: white;
      border: none;
      cursor: pointer;
    }
    .key-symbol {
      font-size: 24px;             /* Symbol size */
      color: goldenrod;            /* Gold colour */
      margin-right: 8px;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2><span class="key-symbol">🔑</span>Login</h2>
  <form onsubmit="return checkLogin()">
    <label><b>User ID:</b></label>
    <input type="text" id="userid" oninput="clearError(this)" placeholder="Enter User ID">

    <label><b>Password:</b></label>
    <input type="password" id="password" oninput="clearError(this)" placeholder="Enter Password">

    <input type="submit" value="Login">

    <div id="errorMsg" class="error"></div>
  </form>
</div>

<script>
function checkLogin() {
  var user = document.getElementById("userid");
  var pass = document.getElementById("password");
  var errorMsg = document.getElementById("errorMsg");

  // Multiple fixed users
  var users = [
    {id: "Aayush", pass: "12345"},
    {id: "Bambam", pass: "12345"},
    {id: "Pritam", pass: "12345"},
    {id: "Shubham", pass: "12345"}
  ];

  // Reset styles
  user.classList.remove("input-error");
  pass.classList.remove("input-error");
  errorMsg.innerHTML = "";
  
   // Blank check first
  if (user.value.trim() === "" && pass.value.trim() === "") {
    errorMsg.innerHTML = "❌ User ID aur Password blank hain!";
    user.classList.add("input-error");
    pass.classList.add("input-error");
    return false;
  } else if (user.value.trim() === "") {
    errorMsg.innerHTML = "❌ User ID blank hai!";
    user.classList.add("input-error");
    return false;
  } else if (pass.value.trim() === "") {
    errorMsg.innerHTML = "❌ Password blank hai!";
    pass.classList.add("input-error");
    return false;
  }

  // Check if entered User ID exists
  var foundUser = users.find(u => u.id === user.value);

  if (!foundUser) {
    errorMsg.innerHTML = "❌ User ID galat hai!";
    user.classList.add("input-error");
    return false;
  } else if (foundUser.pass !== pass.value) {
    errorMsg.innerHTML = "❌ Password galat hai!";
    pass.classList.add("input-error");
    return false;
  } else {
    alert("Login Successful! Welcome " + foundUser.id);
    return true;
  }
}

function clearError(input) {
  input.classList.remove("input-error");
  document.getElementById("errorMsg").innerHTML = "";
}
</script>

</body>
</html>
