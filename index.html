<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      width: 100%;   
      max-width: 400px;
      margin: 100px auto;
      padding: 20px;
      background-color: #ffffff;
      border: 2px solid rgb(0, 0, 0);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(206, 203, 203, 0.718);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
    }
    .error {
      color: rgb(241, 3, 3);
      font-size: 16px;
      margin-top: 10px;
    }
    .input-error {
      border: 2px solid rgb(241, 7, 7);
      background-color: #ffffff;
    }
    input {
      width: 100%;
      padding: 7px;
      margin: 5px 0;
      border-radius: 5px;
      border: 2px solid #808080;
    }
    input[type="submit"] {
      background-color: rgb(20, 101, 206);
      color: #ffffff;
      border: none;
      cursor: pointer;
    }
    .key-symbol {
      font-size: 24px;
      color: rgb(240, 175, 12);
      margin-right: 8px;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2><span class="key-symbol">🔑</span>Login</h2>
  <!-- ✅ form tag सही किया -->
  <form onsubmit="return redirectToWelcome()">
     <label><b>Name:</b></label>
    <input type="text" id="name" placeholder="Enter Your Name">

    <label><b>User ID:</b></label>
    <input type="text" id="userid" oninput="clearError(this)" placeholder="Enter User ID">

    <label><b>Password:</b></label>
    <input type="password" id="password" oninput="clearError(this)" placeholder="Enter Password">

    <input type="submit" value="Login">

    <div id="errorMsg" class="error"></div>
  </form>
</div>

<script>
 function redirectToWelcome() {
  let nameInput = document.getElementById("name");
  let userInput = document.getElementById("userid");
  let passInput = document.getElementById("password");
  let errorMsg = document.getElementById("errorMsg");

  let name = nameInput.value;
  let user = userInput.value;
  let pass = passInput.value;

  let users = [
    {id: "Aayush", pass: "12345"},
    {id: "Bambam", pass: "12345"},
    {id: "Pritam", pass: "12345"},
    {id: "Shubham", pass: "7575"}
  ];

  // Reset styles
  userInput.classList.remove("input-error");
  passInput.classList.remove("input-error");
  errorMsg.innerHTML = "";

  // Blank check
  if (name.trim() === "" || user.trim() === "" || pass.trim() === "") {
    errorMsg.innerHTML = "❌ Name, User ID aur Password blank nahi hone chahiye!";
    return false;
  }

  let foundUser = users.find(u => u.id === user);

  if (!foundUser) {
    errorMsg.innerHTML = "❌ User ID galat hai!";
    userInput.classList.add("input-error");
    return false;
  } else if (foundUser.pass !== pass) {
    errorMsg.innerHTML = "❌ Password galat hai!";
    passInput.classList.add("input-error");
    return false;
  } else {
    // ✅ Save Name in localStorage
    localStorage.setItem("loggedName", name);
    window.location.href = "welcome.html";
    return false;
  }
}

</script>

</body>
</html>
