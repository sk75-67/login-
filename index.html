<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      width: 100%;   
      max-width: 400px;
      margin: 100px auto;
      padding: 20px;
      background-color: #ffffff;
      border: 2px solid rgb(0, 0, 0);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(206, 203, 203, 0.718);
    }
    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
    }
    .error {
      color: rgb(241, 3, 3);
      font-size: 16px;
      margin-top: 10px;
    }
    .input-error {
      border: 2px solid rgb(241, 7, 7);
      background-color: #ffffff;
    }
    input {
      width: 100%;
      padding: 7px;
      margin: 5px 0;
      border-radius: 5px;
      border: 2px solid #808080;
    }
    input[type="submit"] {
      background-color: rgb(20, 101, 206);
      color: #ffffff;
      border: none;
      cursor: pointer;
    }
    .key-symbol {
      font-size: 24px;
      color: rgb(240, 175, 12);
      margin-right: 8px;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2><span class="key-symbol">🔑</span>Login</h2>
  <!-- ✅ form tag सही किया -->
  <form onsubmit="return redirectToWelcome()">
     <label><b>Name:</b></label>
    <input type="text" id="name" placeholder="Enter Your Name">

    <label><b>User ID:</b></label>
    <input type="text" id="userid" oninput="clearError(this)" placeholder="Enter User ID">

    <label><b>Password:</b></label>
    <input type="password" id="password" oninput="clearError(this)" placeholder="Enter Password">

    <input type="submit" value="Login">

    <div id="errorMsg" class="error"></div>
  </form>
</div>

<script>
  function redirectToWelcome() {
    let name = document.getElementById("name").value;
    let user = document.getElementById("userid").value;
    let pass = document.getElementById("password").value;
    let errorMsg = document.getElementById("errorMsg");

    // Multiple fixed users
    let users = [
      {id: "Aayush", pass: "12345"},
      {id: "Bambam", pass: "12345"},
      {id: "Pritam", pass: "12345"},
      {id: "Shubham", pass: "7575"}
    ];

    // Reset styles
    user.classList.remove("input-error");
    pass.classList.remove("input-error");
    errorMsg.innerHTML = "";

    // Blank check
    if (user.value.trim() === "" && pass.value.trim() === "") {
      errorMsg.innerHTML = "❌ User ID aur Password blank hain!";
      user.classList.add("input-error");
      pass.classList.add("input-error");
      return false;
    } else if (user.value.trim() === "") {
      errorMsg.innerHTML = "❌ User ID blank hai!";
      user.classList.add("input-error");
      return false;
    } else if (pass.value.trim() === "") {
      errorMsg.innerHTML = "❌ Password blank hai!";
      pass.classList.add("input-error");
      return false;
    }

    // Check if entered User ID exists
    var foundUser = users.find(u => u.id === user.value);

    if (!foundUser) {
      errorMsg.innerHTML = "❌ User ID galat hai!";
      user.classList.add("input-error");
      return false;
    } else if (foundUser.pass !== pass.value) {
      errorMsg.innerHTML = "❌ Password galat hai!";
      pass.classList.add("input-error");
      return false;
    } else {
        // ✅ Direct redirect with username save
  localStorage.setItem("loggedUser", foundUser.id);
      window.location.href = "welcome.html"; // ✅ अब यहीं redirect होगा
      return false; // form reload रोकने के लिए
    }
  }

  function clearError(input) {
    input.classList.remove("input-error");
    document.getElementById("errorMsg").innerHTML = ""; 
  }
</script>

</body>
</html>
